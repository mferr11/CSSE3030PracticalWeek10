plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'jobsportal.JobsPortalApp'
}

// `./gradlew run` is used for manual browsing and the JMeter load test (Part 3),
// so the random response delay (trap for Part 2, Q2) is switched off.
tasks.named('run') {
    systemProperty 'demo.delay', 'false'
}

// The default `test` task is not used by the worksheet.
tasks.named('test') {
    enabled = false
}

// Part 2: Selenium tests. The test fixture starts the app in-process on port 8080
// (with demo.delay=true), so the app must NOT already be running.
tasks.register('testQ2', Test) {
    group = 'verification'
    description = 'Runs the Part 2 Selenium tests (JobSearchTest, FlakySearchTest).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    outputs.upToDateWhen { false }   // always rerun, so no cleanTestQ2 is needed
    filter {
        includeTestsMatching 'jobsportal.JobSearchTest'
        includeTestsMatching 'jobsportal.FlakySearchTest'
        failOnNoMatchingTests = false
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'short'
        showStandardStreams = false
    }
}
